name: private_video_downloader
description: Private video downloader — Android MVP client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.3
  receive_sharing_intent: ^1.8.1
  path_provider: ^2.1.5
  media_store_plus: ^0.1.3
  open_filex: ^4.5.2
  share_plus: ^10.1.2
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  lucide_icons_flutter: ^3.0.5
  video_player: ^2.9.5
  flutter_svg: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#151528"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/illustrations/brain_side_profile.svg
