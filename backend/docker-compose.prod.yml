# Production stack for LinkClip API (Hetzner / single VPS).
# Only Caddy binds :80 and :443. API, Postgres, Redis stay on the private Docker network.
#
# Prerequisites:
#   - Create .env from .env.example (POSTGRES_PASSWORD)
#   - Create .env.production from .env.production.example (fill secrets + DATABASE_URL password)
#   - secrets/cookies/global.txt on host (mounted read-only into api/worker)
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: linkclip-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - linkclip

  dozzle:
    image: amir20/dozzle:latest
    container_name: linkclip-dozzle
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:9999:8080"
    networks:
      - linkclip

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkclip-backend:latest
    container_name: linkclip-api
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    expose:
      - "3000"
    volumes:
      - downloads_data:/app/storage
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - linkclip

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkclip-backend:latest
    container_name: linkclip-worker
    restart: unless-stopped
    env_file:
      - .env.production
    command: ["npm", "run", "worker"]
    volumes:
      - downloads_data:/app/storage
      - ./secrets:/app/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - linkclip

  # Optional YouTube PO Token HTTP provider (bgutil). Not started unless profile `pot` is enabled.
  # Enable: docker compose -f docker-compose.prod.yml --profile pot up -d
  # Set in .env.production: YTDLP_PO_TOKEN_ENABLED=true, YTDLP_PO_TOKEN_PROVIDER_URL=http://bgutil-pot:4416
  bgutil-pot:
    profiles: ["pot"]
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.1
    container_name: linkclip-bgutil-pot
    restart: unless-stopped
    expose:
      - "4416"
    networks:
      - linkclip
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:4416/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  cleanup:
    image: alpine:3.20
    container_name: linkclip-cleanup
    restart: unless-stopped
    environment:
      MEDIA_RETENTION_MINUTES: "30"
      UPLOAD_RETENTION_MINUTES: "120"
    volumes:
      - downloads_data:/app/storage
    command:
      - sh
      - -c
      - |
        set -eu
        MEDIA_RET=$${MEDIA_RETENTION_MINUTES:-30}
        UP_RET=$${UPLOAD_RETENTION_MINUTES:-120}
        echo "linkclip-cleanup: uploads retention $${UP_RET}m; other storage $${MEDIA_RET}m (every 300s)"
        while true; do
          find /app/storage/devices -path '*/uploads/*' -type f -mmin +$${UP_RET} -delete 2>/dev/null || true
          find /app/storage -type f ! -path '*/uploads/*' -mmin +$${MEDIA_RET} -delete 2>/dev/null || true
          find /app/storage -type d -empty -delete 2>/dev/null || true
          sleep 300
        done
    networks:
      - linkclip

  postgres:
    image: postgres:16
    container_name: linkclip-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: linkclip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: linkclip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkclip -d linkclip"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - linkclip

  redis:
    image: redis:7-alpine
    container_name: linkclip-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - linkclip

volumes:
  postgres_data:
  redis_data:
  downloads_data:
  caddy_data:
  caddy_config:

networks:
  linkclip:
    driver: bridge
